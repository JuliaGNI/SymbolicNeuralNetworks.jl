# Without this file Codecov's defaults apply: `target: auto` with `threshold: 0%`, which fails a pull
# request for *any* decrease. That is sharper than it reads — #61 was reported as a 0.24% regression
# while its hit count went **up** by 22 lines, because the denominator grew faster than the numerator.
# Codecov also counts a *modified* line as part of the diff, so splitting a signature per shape
# re-attributes lines that were already uncovered to whoever split them.
#
# 1% on both, matching `GeometricOptimizers`. `informational` is deliberately *not* set: the check
# should still be able to fail.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%
