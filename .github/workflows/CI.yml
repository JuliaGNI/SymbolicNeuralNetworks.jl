name: CI
on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# Temporary: go straight to the General registry instead of through a package server.
#
# `AbstractNeuralNetworks` 0.7.0 was registered at 04:00 UTC on 2026-08-23 and the package servers
# were still serving a registry that stopped at 0.6.4 hours later, so every job here died in
# `Pkg.resolve` — "possible versions are: 0.1.0-0.6.4 … restricted to versions 0.7 by
# SymbolicNeuralNetworks" — before running a single test. An empty `JULIA_PKG_SERVER` makes Pkg clone
# the registry over git and fetch packages from their own repositories, which resolves the same
# environment that resolves locally.
#
# The cost is speed: no CDN and no registry tarball. Remove this once the package servers have caught
# up (check with `curl -s https://pkg.julialang.org/registries`), and check whether it is still
# needed before assuming it is.
env:
  JULIA_PKG_SERVER: ""
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.11"
          - "^1.12"
          - "^1.13.0-0"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - default
        experimental: [false]
        include:
          - version: "nightly"
            os: ubuntu-latest
            arch: default
            experimental: true
          - version: "nightly"
            os: macOS-latest
            arch: default
            experimental: true
          - version: "nightly"
            os: windows-latest
            arch: default
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # `JULIA_PKG_SERVER: ""` above makes Pkg keep the General registry as a git clone and update it
      # by fetch-and-rebase. `julia-actions/cache` keys its cache by workflow/job/os/version, so each
      # matrix entry carries its own clone from run to run -- and once an entry's clone reaches a
      # state that cannot fast-forward, it never recovers on its own:
      #
      #     ┌ Warning: Cannot perform fast-forward merge
      #     │     — ~/.julia/registries/General — registry failed to rebase on origin/master
      #
      # Pkg carries on after printing that and resolves against whatever commit the clone stopped at,
      # so the job dies with an "Unsatisfiable requirements" message that names a version bound and
      # says nothing about the registry. That took the 1.13 and nightly jobs down on 750d073 while
      # 1.10 and 1.12, whose caches held healthy clones, resolved the same bounds and passed.
      #
      # Resetting to `origin/master` is the same repair the clone needs locally; the registry is a
      # pure mirror, so nothing is lost, and a clone that cannot even be reset is thrown away for
      # `julia-buildpkg` to fetch again.
      - name: Keep the cached General clone fast-forwardable
        shell: bash
        run: |
          reg="$HOME/.julia/registries/General"
          if [ -d "$reg/.git" ]; then
            git -C "$reg" fetch --quiet origin && git -C "$reg" reset --hard --quiet origin/master \
              || rm -rf "$reg" "$HOME/.julia/registries/General.toml"
          fi
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
